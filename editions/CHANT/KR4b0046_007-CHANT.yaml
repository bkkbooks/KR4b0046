body:
  text: 卷七見賣玉器者并序見賣玉器者并序見賣玉器者或人欲買疑其是珉不肯成市聊作此詩以戲買者涇渭不可雜珉玉當早分子實舊楚客蒙俗謬前聞安知理孚采豈識質明溫我方歷上國從洛入函轅揚光十貴室馳譽四豪門奇聲振朝邑高價服鄉村寧能與爾曹瑜瑕稍辨論從登香爐峰辭宗盛荊夢登歌美鳧繹徒收杞梓饒曾非羽人宅羅景藹雲扃沾光扈龍策御風親列涂乘山窮禹跡含嘯對霧岑延蘿倚峰壁青冥搖煙樹穹跨負天石霜崖滅土膏金澗測泉脈旋淵抱星漢乳竇通海碧谷館駕鴻人巖棲咀丹客殊物藏珍怪奇心隱仙籍高世伏音華綿古遁精魄蕭瑟生哀聽參差遠驚覿慚無獻賦才洗汙奉毫帛夢歸鄉夢歸鄉銜淚出郭門撫劍無人逵沙風暗空起離心眷鄉畿夜分就孤枕夢想暫言歸孀婦當戶歎搔絲復鳴機慊款論久別相將還綺闈歷歷簷下涼朧朧帳裏輝刈蘭爭芬芳採菊競葳蕤開奩奪香蘇探袖解纓徽寐中長路近覺後大江違驚起空歎息恍惚神魂飛白水漫浩浩高山壯巍巍波瀾異往復風雲改榮衰此土非吾土慷慨當告誰從臨海王上荊初發新渚從臨海王上荊初發新渚客行有苦樂但問客何行扳龍不待翼附驥絕塵冥梁珪分楚牧羽鷁指全荊雲艫掩江汜千里被連旌戾戾旦風遒嘈嘈晨鼓鳴收纜辭帝郊揚棹發皇京狐兔懷窟志犬馬戀主情撫襟同太息相顧俱涕零奉役塗未啟思歸思已盈望孤石江南多暖谷雜樹茂寒峰朱華抱白雪陽條熙朔風蚌節流綺藻輝石亂煙虹泄雲去無極馳波往不窮嘯歌清漏畢徘徊朝景終浮生會當幾歡酌每盈衷登黃鶴磯登黃鶴磯木落江渡寒鴈還風送秋臨流斷商絃瞰川悲棹謳適郢無東轅還夏有西浮三崖隱丹磴九派引滄流淚竹感湘別弄珠懷漢遊豈伊藥餌泰得奪旅人憂岐陽守風岐陽守風差池玉繩高掩映瑤井沒廣岸屯宿陰懸崖棲歸月役人喜先馳軍令申早發洲迥風正悲江寒霧未歇飛雲日東西別鶴方楚越塵衣孰揮澣蓬思亂光髮在江陵歎年傷老五難未易夷三命戒淵抱方瞳起松髓赬髮疑桂腦役生良自休大患安足保開簾窺景夕備屬雲物好翾翾燕弄風嫋嫋柳垂道池瀆亂蘋萍園援美花草節如驚灰異零落就衰老翫月城西門廨中翫月城西門廨中始見西南樓纖纖如玉鉤未映東北墀娟娟似娥眉娥眉蔽珠櫳玉鉤隔瑣窗三五二八時千里與君同夜移衡漢落徘徊入戶中歸華先委露別葉早辭風客遊厭苦辛仕子倦飄塵休澣自公日宴慰及私辰蜀琴抽白雪郢曲發陽春肴乾酒未闋金壺啟夕淪迴軒駐輕蓋留酌待情人代挽歌獨處重冥下憶昔登高臺傲岸平生中不為物所裁埏門只復閉白蟻相將來生時芳蘭體小蟲今為災玄鬢無復根枯髏依青苔憶昔好飲酒素盤進青梅彭韓及廉藺疇昔已成灰壯士皆死盡餘人安在哉夜聽妓二首夜來坐幾時銀漢傾露落澄愴入閨景葳蕤被園藿絲管感暮情哀音遶梁作芳盛不可恆及歲共為樂天明坐當散琴酒駛弦酌蘭膏消耗夜轉多亂筵雜坐更絃歌傾情逐節寧不苦特為盛年惜容華梅花落中庭雜樹多偏為梅咨嗟問君何獨然念其霜中能作花露中能作實搖蕩春風媚春日念爾零落逐寒風徒有霜華無霜質古辭容華不待年何為客遊梁九月寒陰合悲風斷君腸歎息空房婦幽思坐自傷勞心結遠路惆悵獨未央可愛風帷關珠帶月幌垂霧羅魏粲縫秋裳趙豔習春歌夜聽聲辭鄉不覺遠歡寡憂自繁何用慰秋望清燭視夜翻酒後晨節無兩淹年意不俱處自非羽酌歡何用慰愁旅講易雲澤翔羽姬橫益招逸人賁園無金尚履道易書紳王昭君既事轉蓬遠心隨鴈路絕霜鞞旦夕驚邊笳中夜咽中興歌十首千冬遲一春萬夜見朝日生平值中興歡起百憂畢中興太平運化清四海樂祥景照玉臺紫煙遊鳳閣碧樓舍夜月紫殿爭朝光綵墀散蘭麝風起自生芳白日照前窗玲瓏綺羅中美人掩輕扇含思歌春風三五容色滿四五妙華歇已輸春日歡分隨秋光設北出湖邊戲前還苑中遊飛縠繞長松馳管逐波流九月秋水清三月春花滋千金逐良日皆競中興時窮泰已有分壽夭復屬天既見中興樂莫持憂自煎襄陽是小地壽陽非帝城今日中興樂遙治在上京梅花一時豔竹葉千年色願君松柏心採照無窮極吳歌二首吳歌二首夏口樊城岸曹公卻月戍但觀流水還識是儂流下夏口樊城岸魯公卻月樓觀見流水還識是儂淚流人言荊江狹荊江定自闊五兩了無聞風聲那得達與謝尚書莊三連句霞輝兮澗朗日靜兮川澄風輕桃欲開露重蘭未勝水光溢兮松霧動山煙疊兮石露凝掩映晨物綵連綿夕羽興在荊州與張史君李居士連句在荊州與張史君李居士連句橋磴支吾轍篁路拂輕鞍三尹無喜色一適或垂竿月下登樓連句髴髣蘿月光繽紛篁霧陰樂來亂憂念酒至歇憂心鮑博士露入覺牖高螢蜚測苑深清氣澄永夜流吹不可臨王延秀密峰集浮碧疏瀾道瀛潯嗽玉延幽性攀桂藉知音荀原之辰意事淪晦良歡戒勿祲昭景有遣駟孤賈無留金荀中書萬秋字謎三首字謎三首二形一體四支八頭四八一八飛泉仰流井頭如刀尾如鉤中央橫廣四角六抽右面負兩刃左邊雙屬牛龜乾之一九隻立無偶坤之二六宛然雙宿土
