body:
  text: 附錄扶風歌扶風歌昨辭金華殿今次雁門縣寢臥握秦戈棲息抱越箭忍悲別親知行泣隨征傳寒煙空徘徊朝日乍舒卷詠老詠老軟顏收紅蕊玄鬢生素華冉冉逝將老咄咄奈老何春詠春詠節運同可悲莫若春光甚和風未及燠遺涼清且凜贈顧墨曹贈顧墨曹昏明易遠離會難揆雲轍泉分西艫東軌擬古詩擬古詩中坐溢朱組步欄簉瓊弁禮登佇眷情樂闋延皇眄詩詩豎儒守一經未足識行藏
