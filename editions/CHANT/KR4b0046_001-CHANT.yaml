body:
  text: 卷一舞鶴賦散幽經以驗物偉胎化之仙禽鍾浮曠之藻質抱清迥之明心指蓬壺而翻翰望崑閬而揚音匝日域以迴騖窮天步而高尋踐神區其既遠積靈祀而方多精含丹而星耀頂凝紫而煙華引圓吭之纖婉頓脩趾之鴻姱疊霜毛而弄影振玉羽而臨霞朝戲於芝田夕飲乎瑤池厭江海而遊澤掩雲羅而見羈去帝鄉之岑寂歸人寰之喧卑歲崢嶸而催暮心惆悵而哀離於是窮陰殺節急景凋年涼沙振野箕風動天嚴嚴苦霧皎皎悲泉冰塞長河雪滿群山既而雰昏夜歇景物澄廓星翻漢回曉月將落感寒雞之早晨憐霜鴈之違漠臨驚風之蕭條對流光之照灼唳清響於丹墀舞飛容於金閣始連軒以鳳蹌終宛轉而龍躍躑躅徘徊振迅騰摧驚身蓬集矯翅雪飛離網別赴合渚相依將興中止若往而歸颯沓矜顧遷延遲暮逸翮後塵翱翥先路指會規翔臨歧矩步態有遺妍貌無停趣奔機逗節角睞分形揚翹緩騖並翼連聲輕迹凌亂浮影交橫眾變繁姿參差洊密煙交霧凝若無毛質風去雨還不可談悉既散魂而盪目迷不知其所之忽星離而雲羅整神容而自持仰天居之崇絕更惆惕而驚思當是時也燕姬色沮巴僮心恥巾拂兩停九劍雙止雖邯鄲其敢倫豈陽阿之能擬入衛國而乘軒出吳都而傾市守馴養於千齡結長悲於萬里蕪城賦濔迆平原南馳蒼梧漲海北走紫塞鴈門柂以漕渠軸以崑崗重關複江之奧四會五達之莊當昔全盛之時車掛轊人駕肩廛閈撲地歌吹沸天孳貨鹽田鏟利銅山才力雄富士馬精妍故能侈秦法佚周令劃崇墉刳濬洫圖修世以休命是以板築雉堞之殷井幹烽櫓之勤格高五嶽袤廣三墳崒若斷岸矗似長雲製磁石以禦衝糊赬壤以飛文觀基扃之固護將萬祀而一君出入三代五百餘載竟瓜割而豆分澤葵依井荒葛罥塗壇羅虺蜮階鬭麇鼯木魅山鬼野鼠城狐風嘷雨嘯昏見晨趨饑鷹礪吻寒鴟嚇雛伏暴藏虎乳血餐膚崩榛塞路崢嶸古馗白楊早落塞草前衰稜稜霜氣莿莿風威孤蓬自振驚沙坐飛灌莽杳而無際叢薄紛其相依通池既已夷峻隅又已頹直視千里外唯見起黃埃凝思寂聽心傷已摧若夫藻扃黼帳歌堂舞閣之基璇淵碧樹弋林釣渚之館吳蔡齊秦之聲魚龍爵馬之玩皆薰歇燼滅光沉響絕東都妙姬南國佳人蕙心紈質玉貌絳脣莫不埋魂幽石委骨窮塵豈憶同輦之愉樂離宮之苦辛哉天道如何吞恨者多抽琴命操為蕪城之歌歌曰邊風起兮城上寒井徑滅兮丘隴殘千齡兮萬代共盡兮何言芙蓉賦感衣裳於楚賦詠憂思於陳詩訪群英之豔絕標高名於澤芝會春陂乎夕張搴芙蓉而水嬉抽我衿之桂蘭點子吻之瑜辭選群芳之徽號抱茲性之清芬稟若華之驚絕單蓲陽之妙手測淲池之光潔爍彤輝之明媚粲雕霞之繁悅顧椒丘而非偶豈園桃而能埒彪炳以蒨藻翠景而紅波青房兮規接紫的兮圓羅樹妖遙之弱幹散菡萏之輕荷上星光而倒景下龍鱗而隱波戲錦鱗而夕映曜繡羽以晨過結遊童之湘吹起榜妾之江歌備日月之溫麗非盛明而謂何若乃當融風之暄盪承暑雨之平渥被瑤塘之周流繞金渠之屈曲排積霧而楊芬鏡洞泉而含綠葉折水以為珠條集露而成玉潤蓬山之瓊膏輝蔥河之銀燭冠五華於仙草超四照於靈木雜眾姿於開卷閱群貌於昏明無長袖之容止信不笑之空城森紫葉以上擢紛湘蕊而下傾根雖割而琯徹柯既解而絲縈感盛衰之可懷質始終而常清故其為芳也綢繆其為媚也奔發對粧則色姝比蘭則香越泛明綵於宵波飛澄華於曉月陋荊姬之朱顏笑夏女之光髮恨狎世而貽賤徒愛存而賞沒雖凌群以擅奇終從歲而零歇遊思賦雲徑兮海衝上潮兮送風秋水兮駕浦涼煙兮冒江暮氣起兮遠岸黑陽精滅兮天際紅波沄沄兮無底山森森兮萬重平隰兮亘岸通川兮瀉壑仰盡兮天經俯窮兮地絡望波際兮曇曇眺雲間兮灼灼乃江南之斷山信海上之飛鶴指煙霞而問鄉窺林嶼而訪泊撫身事而識苦念親愛而知樂苦與樂其何言悼人生之長役捨堂宇之密親坐江潭而為客對蒹葭之遂黃視零露之方白鴻晨驚以響湍泉夜下而鳴石結中洲之雲蘿託綿思於遙夕瞻荊吳之遠山望邯鄲之長陌塞風馳兮邊草飛胡沙起兮鴈揚翮雖燕越之異心在禽鳥而同戚悵收情而抆淚遣繁悲而自抑此日中其幾時彼月滿而將蝕生無患於不老奚引憂以自逼物因節以卷舒道與運而升息賤賣卜以當壚隱我耕而子織誠愛秦王之奇勇不願絕筋而稱力已矣哉使豫章生而可知夫何異乎叢棘飛蛾賦仙鼠伺闇飛蛾候明均靈舛化詭欲齊生觀齊生而欲詭各會性以憑方陵燋煙之浮景赴熙焰之明光拔身幽草下畢命在此堂本輕死以邀得雖糜爛其何傷豈學山南之文豹避雲霧而巖藏
