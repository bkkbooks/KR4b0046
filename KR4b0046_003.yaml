body:
  text: 卷三代東武吟代東武吟主人且勿喧賤子歌一言僕本寒鄉士出身蒙漢恩始隨張校尉召募到河源後逐李輕車追虜出塞垣密塗亙萬里寧歲猶七奔肌力盡鞍甲心思歷涼溫將軍既下世部曲亦罕存時事一朝異孤績誰復論少壯辭家去窮老還入門腰鎌刈葵藿倚杖牧雞豚昔如韝上鷹今似檻中猿徒結千載恨空負百年怨棄席思君幄疲馬戀君軒願垂晉主惠不愧田子魂代出自薊北門行代出自薊北門行羽檄起邊亭烽火入咸陽徵師屯廣武分兵救朔方嚴秋筋竿徑虜陳精且彊天子按劍怒使者遙相望鴈行緣石徑魚貫渡飛梁簫鼓流漢思旌甲被胡霜疾風衝塞起沙礫自飄揚馬毛縮如蝟角弓不可張時危見臣節世亂識忠良投軀報明主身死為國殤代結客少年場行代結客少年場行驄馬金絡頭錦帶佩吳鉤失意杯酒間白刃起相讎追兵一旦至負劍遠行遊去鄉三十載復得還舊丘升高臨四關表裏望皇州九塗平若水雙闕似雲浮扶宮羅將相夾道列王侯日中市朝滿車馬若川流擊鍾陳鼎食方駕自相求今我獨何為坎壈懷百憂代東門行代東門行傷禽惡弦驚倦客惡離聲離聲斷客情賓御皆涕零涕零心斷絶將去復還訣一息不相知何況異鄉別遙遙征駕遠杳杳白日晚居人掩閨臥行子夜中飯野風吹秋木行子心腸斷食梅常苦酸衣葛常苦寒絲竹徒滿坐憂人不解顏長歌欲自慰彌起長恨端代苦熱行代苦熱行赤坂橫西阻火山赫南威身熱頭且痛鳥墜魂來歸湯泉發雲潭焦烟起石圻日月有恆昏雨露未嘗晞丹蛇踰百尺玄蜂盈十圍含沙射流影吹蠱病行暉瘴氣晝熏體草露夜霑衣饑猿莫下食晨禽不敢飛毒涇尚多死渡瀘寧具腓生軀蹈死地昌志登禍機戈船榮既薄伏波賞亦微爵輕君尚惜士重安可希代白頭吟代白頭吟直如朱絲繩清如玉壺冰何慚宿昔意猜恨坐相仍人情賤恩舊世議逐衰興毫髮一為瑕丘山不可勝食苗實碩鼠點白信蒼蠅鳧鵠遠成美薪芻前見陵申黜褒女進班去趙姬升周王日淪惑漢帝益嗟稱心賞猶難恃貌恭豈易憑古來共如此非君獨撫膺代蒿里行同盡無貴賤殊願有窮申馳波催永夜零露逼短晨結我幽山駕去此滿堂親虛容遺劍佩實貌戢衣巾斗酒安可酌尺書誰復陳年代稍推遠懷抱日幽淪人生良自劇天道與何人齎我長恨意歸為狐兔塵代放歌行代放歌行蓼蟲避葵堇習苦不言非小人自齷齪安知曠士懷雞鳴洛城裏禁門平旦開冠蓋縱橫至車騎四方來素帶曳長飆華纓結遠埃日中安能止鍾鳴猶未歸夷世不可逢賢君信愛才明慮自天斷不受外嫌猜一言分圭爵片善辭草萊豈伊白璧賜將起黃金臺今君有何疾臨路獨遲回代升天行代升天行家世宅關輔勝帶宦王城備聞十帝事委曲兩都情倦見物興衰驟覩俗屯平翩翻若回掌恍惚似朝榮窮途悔短計晚志重長生從師入遠嶽結友事仙靈五圖發金記九籥隱丹經風餐委松宿雲臥恣天行冠霞登綵閣解玉飲椒庭暫遊越萬里少別數千齡鳳臺無還駕簫管有遺聲何時與汝曹啄腐共吞腥代別鶴操代別鶴操雙鶴俱起時徘徊滄海間長弄若天漢輕軀似雲懸幽客時結侶提攜遊三山青繳凌瑤臺丹羅籠紫煙海上悲風急三山多雲霧散亂一相失驚孤不得住緬然日月馳遠矣絶音儀有願而不遂無怨以生離鹿鳴隱深草蟬鳴隱高枝心自有所存旁人那得知代雉朝飛雉朝飛振羽翼專場挾兩恃彊力媒已驚翳又逼黃間潛彀盧矢直刎繡頸碎錦臆絶命君前無怨色握君手執杯酒意氣相傾死何有代淮南王二首淮南王好長生服食練氣讀仙經琉璃藥碗牙作盤金鼎玉匕合神丹神丹神丹戲紫房紫房綵女弄明璫鸞歌鳳舞斷君腸朱城九門門九閨願逐明月入君懷入君懷結君佩怨君恨君恃君愛築城思堅劍思利同盛同衰莫相棄代空城雀代空城雀雀乳四鷇空城之阿朝食野粟夕飲冰河高飛畏鴟鳶下飛畏網羅辛傷伊何言怵迫良已多誠不及青鳥遠食玉山禾猶勝吳宮燕無罪得焚窠賦命有厚薄長歎欲如何代鳴鴈行代鳴鴈行雍雍鳴鴈鳴始旦齊行命侶入雲漢中夜相失群離亂留連徘徊不忍散憔悴容儀君不知辛苦風霜亦何為代夜坐吟代夜坐吟冬夜沉沉夜坐吟含聲未發已知心霜入幕風度林朱燈滅朱顏尋體君歌逐君音不貴聲貴意深代北風涼行代北風涼行北風涼雨雪雱京洛女兒多嚴粧遙豔帷中自悲傷沉吟不語若有忘問君得行何當歸苦使妾坐自傷悲慮年至慮顏衰情易遠恨難追代春日行代春日行獻歲發吾將行春山茂春日明園中鳥多嘉聲梅始發桃始青泛舟艫齊櫂驚奏採菱歌鹿鳴風微起波微生絃亦發酒亦傾入蓮池折桂枝芳袖動芬葉披兩相思兩不知代少年時至衰老行憶昔少年時馳逐好名晨結友多貴門出入富兒鄰綺羅豔華風車馬自揚塵歌唱青齊女彈箏燕趙人好酒多芳氣肴味厭時新今日每相念此事邈無因寄語後生子作樂當及春代陽春登荊山行代陽春登荊山行旦登荊山頭崎嶇道難遊早行犯霜露苔滑不可留極眺入雲表窮目盡帝州方都列萬室層城帶高樓奕奕朱軒馳紛紛高衣流日氣映山浦暄霧逐風收花木亂平原桑柘盈平疇攀條弄紫莖藉露折芳柔遇物雖成趣念者不解憂且共傾春酒長歌登山丘代朗月行代朗月行朗月出東山照我綺窗前窗中多佳人被服妖且妍靚粧坐帳裏當戶弄清絃鬢奪衛女迅體絶飛燕先為君歌一曲當作朗月篇酒至顏自解聲和心亦宣千金何足重所存意氣間代堂上歌行代堂上歌行四坐且莫喧聽我堂上歌昔仕京洛時高門臨長河出入重宮裏結交曹與何車馬相馳逐賓朋好容華陽春孟春月朝光散流霞輕步逐芳風言笑弄丹葩暉暉朱顏酡紛紛織女梭滿堂皆美人自我對湘娥雖謝侍君間明粧帶綺羅箏笛更彈吹高唱好相和萬曲不關心一曲動情多欲知情厚薄更聽此聲過代貧賤愁苦行湮沒雖死悲貧苦即生劇長嘆至天曉愁苦窮日夕盛顏當少歇鬢髮先老白親友四面絶朋知斷三益空庭慚樹萱藥餌愧過客貧年忘日時黯顏就人惜俄頃不相酬恧怩面已赤或以一金恨便成百年隙心為千條計事未見一獲運圮津塗塞遂轉死溝洫以此窮百年不如還窀穸代邊居行代邊居行少年遠京陽遙遙萬里方陋巷絶人徑茅屋摧山岡不覩車馬迹但見麋鹿場長松何落落丘隴無復行邊地無高木蕭蕭多白楊盛年日月盡一去萬恨長悠悠世中人爭此錐刀忙不憶貧賤時富貴輒相忘紛紛徒滿目何關慨豫傷不如一畝中高會挹清漿遇樂便作樂莫使候朝光代門有車馬客行門有車馬客問客何鄉士捷步往相訅果得舊鄰里悽悽聲中情慊慊增下理語昔有故悲論今無新喜清晨相訪慰日暮不能已歡戚競尋緒談調何終止辭端竟未究忽唱分途始前悲尚未弭後感方復起嘶聲盈我口談言在君耳手迹可傳心願爾駕行李代悲哉行羈人感淑景緣感欲回轍我行詎幾時華實驟舒結覩實情有悲瞻華意無悅覽物懷同志如何復乖別翩翩翔禽羅關關鳴鳥列翔鳴尚疇偶所歎獨乖絶代櫂歌行代櫂歌行羇客離嬰時飄颻無定所昔秋寓江介茲春客河滸往戢于役身願言永懷楚泠泠篠疏潭雍雍鴈循渚飂戾長風振搖曳高帆舉驚波無留連舟人不躊佇代邽街行代邽街行佇立出門衢遙望轉蓬飛蓬去舊根在連翩逝不歸念我捨鄉俗親好久乖違慷慨懷長想惆悵戀音徽人生隨時變遷化焉可祈百年難必果千慮易盈虧代陳思王白馬篇代陳思王白馬篇白馬騂角弓鳴鞭乘北風要途問邊急雜虜入雲中閉壁自往夏清野徑還冬僑裝多闕絶旅服少裁縫埋身守漢節沉命對胡封薄暮塞雲起飛沙披遠松含悲望兩都楚歌登四墉丈夫設計誤懷恨逐邊戎罷別中國愛邀冀胡馬功去來今何道單賤生所鍾但令塞上兒知我獨為雄代陳思王京洛篇代陳思王京洛篇鳳樓十二重四戶八綺窗繡桷金蓮花桂柱玉盤龍珠簾無隔露羅幌不勝風寶帳三千所為爾一朝容揚芬紫煙上垂綵緑雲中春吹回白日霜歌落塞鴻但懼秋塵起盛愛逐衰蓬坐視青苔滿臥對錦筵空琴瑟縱橫散舞衣不復縫古來共歇薄君意豈獨濃唯見雙黃鵠千里一相從代陸平原君子有所思行代陸平原君子有所思行西出登雀臺東下望雲闕層閣肅天居馳道直如髮繡甍結飛霞璇題納行月築山擬蓬壺穿池類溟渤選色遍齊岱徵聲匝邛越陳鐘陪夕宴笙歌待明發年貌不可還身意會盈歇蟻壤漏山阿絲淚毀金骨器惡含滿欹物忌厚生沒智哉衆多士服理辨昭昧代白紵曲二首代白紵曲二首朱脣動素袖舉洛陽少童邯鄲女古稱緑水今白紵催絃急管為君舞窮秋九月荷葉黃北風驅鴈天雨霜夜長酒多樂未央春風淡蕩俠思多天色淨緑氣研和含桃紅萼蘭紫牙朝日灼爍發園華卷幌結帷羅玉筵齊謳秦吹盧女絃千金顧笑買芳年代白紵舞歌詞代白紵舞歌詞四首四首奉始興王命作并啓侍郎臣鮑照啓被教作白紵舞歌詞謹竭庸陋裁為四曲附啓上呈識方淟悴思塗猥局言既無雅聲未能文不足以宣贊聖旨抽拔妙實謹遣簡餘慚隨悚盈謹啓詞吳刀楚製為佩褘纖羅霧縠垂羽衣含商咀徵歌露晞珠履颯沓紈袖飛淒風夏起素雲回車怠馬煩客忘歸蘭膏明燭承夜暉桂宮柏寢擬天居朱爵文窗韜碧疏象床瑤席鎮犀渠雕屏合匝組帷舒秦箏趙瑟挾笙竽垂璫散佩盈玉除停觴不御欲誰須三星差池露霑濕絃悲管清月將入寒光簫條候蟲急荊王流歎楚妃泣紅顏難長時易戢凝華結綵久延立非君之故豈妄集池中赤鯉庖所捐琴高乘去飛上天命逢福世丁溢恩簪金藉綺升曲筵恩厚德深委如山潔誠洗志期暮年烏白馬角寧足言
