body:
  text: 卷六行京口至竹里行京口至竹里高柯危且竦鋒石橫復仄復澗隱松聲重崖伏雲色冰閉寒方壯風動鳥傾翼折志逢凋嚴孤遊值曛逼兼塗無憩鞍半菽不遑食君子樹令名細人效命力不見長河水清濁俱不息登翻車峴高山絶雲霓深谷斷無光晝夜淪霧雨冬夏結寒霜淖坂既馬嶺磧路又羊腸畏塗疑旅人忌轍覆行箱升岑望原陸四眺極川梁遊子思故居離客遲新鄉知新有客慰追故遊子傷冬日嚴雲亂山起白日欲還次曛霧蔽窮天夕陰晦寒地煙霾有氛氳精光無明異風急野田空飢禽稍相棄含生共通閉懷賢孰為利天規苟平圓寧得已偏媚寫海有歸潮衰容不還稚君今且安歌無念老方至詠史五都矜財雄三川養聲利百金不市死明經有高位京城十二衢飛甍各鱗次仕子彯華纓遊客竦輕轡明星晨未稀軒蓋已雲至賓御紛颯沓鞍馬光照地寒暑在一時繁華及春媚君平獨寂寞身世兩相棄從庾中郎遊園山石室荒塗趣山楹雲崖隱靈室岡澗紛縈抱林障沓重密昏昏磴路深活活梁水疾幽隅秉晝燭地牖窺朝日怪石似龍章瑕璧麗錦質洞庭安可窮漏井終不溢沉空絶景聲崩危坐驚栗神化豈有方妙象竟無述至哉鍊玉人處此長自畢自礪山東望震澤瀾漫潭洞波合沓崿嶂雲漲島遠不測岡澗近難分幽篁愁暮見思鳥傷夕聞以此藉沉痾棲迹別人群結言非盡書有念豈敷文登雲陽九里埭登雲陽九里埭宿心不復歸流年抱衰疾既成雲雨人悲緒終不一徒憶江南聲空録齊后瑟方絶縈絃思豈見繞梁日與伍侍郎別民生如野鹿知愛不知命飲齕具攢聚翹陸欻驚迸傷我慕類心感爾食蘋性漫漫鄢郢塗渺渺淮海徑子無金石質吾有犬馬病憂樂安可言離會孰能定欽哉慎所宜砥德乃為盛貧遊不可忘久交念敦敬吳興黃浦亭庾中郎別風起洲渚寒雲上日無輝連山眇煙霧長波迥難依旅鴈方南過浮客未西歸已經江海別復與親眷違奔景易有窮離袖安可揮歡觴為悲酌歌服成泣衣溫念終不渝藻志遠存追役人多牽滯顧路慚奮飛昧心附遠翰炯言藏佩韋送別王宣城發郢流楚思涉淇興衛情既逢青春獻復值白蘋生廣望周千里江郊藹微明簾爵自惆悵歌管為誰清潁陰騰前藻淮陽流昔聲樹道慕高華屬路佇深馨送從弟道秀別參差生密念躑躅行思疑疑思戀光景密念盈歲時歲時多阻折光景乏安怡以此苦風情日夜驚懸旗登山臨朝日揚袂別所思浸淫旦潮廣瀾漫宿雲滋天陰懼先發路遠常早辭篇詩後相憶杯酒今無持遊子苦行役冀會非遠期贈傅都曹別贈傅都曹別輕鴻戲江潭孤鴈集洲沚邂逅兩相親緣念共無已風雨好東西一隔頓萬里追憶栖宿時聲容滿心耳日落川渚寒愁雲繞天起短翮不能翔徘徊煙霧裏和傅大農與僚故別絶節無緩響傷鴈有哀音非同年歲意誰共別離心伊昔謬通塗冠屣預人林浮江望南嶽登潮窺海陰孰謂遊居淺慕美久相深萋萋春草秀嚶嚶喜候禽辰物盡明茂尊盛獨幽沉之子安所適我方栖舊岑墜歡豈更接明愛邈難尋送盛侍郎餞候亭霑霜襲冠帶驅駕越城闉北臨出塞道南望入鄉津高墉宿寒霧平野起秋塵君為坐堂子我乃負羇人欣悲豈等志甘苦誠異身結涕園中草憔悴悲此春與荀中書別勞舟厭長浪疲旆倦行風連翩感孤志契闊傷賤躬親交篤離愛眷戀置酒終敷文勉征念罷落慰愁容思君吟涉洧撫己謠渡江慚無黃鶴翅安得久相從願遂宿知意不使舊山空喜雨奉敕作營社達群陰屯雲掩積陽河井起龍蒸日魄斂遊光族雲飛泉室震風沉羽鄉升氛浹地維傾潤瀉天潢平灑周海嶽曲潦溢川莊驚雷鳴桂渚回涓流玉堂珍木抽翠條炎卉濯朱芳關市欣九賦京廩開萬箱無謝堯為君何用知柏篁詠蕭史詠蕭史蕭史愛長年嬴女吝童顏火粒願排棄霞霧好登攀龍飛送天路鳳起出秦關身去長不返簫聲時往還贈故人馬子喬六首贈故人馬子喬六首躑躅城上羊攀隅食玄草俱共日月輝昏明獨何早夕風飄野籜飛塵被長道親愛難重見懷憂坐空老空灰滅更燃夕華晨更鮮春冰雖暫解冬水復還堅佳人捨我去賞愛長絶絃歡至不留日感物輒傷年松生隴坂上百尺下無枝東南望河尾西北隱崑崖野風振山籟朋鳥夜驚離悲涼貫年節蔥翠恆若斯安得草木心不怨寒暑移種橘南池上種杏北池中池北既少露池南又多風早寒逼晚歲衰恨滿秋容湘濱有靈鳥其字曰鳴鴻一挹繒繳痛長別遠無雙皎如川上鵠赫似握中丹宿心誰不欺明白古所難憑楹觀皓露灑酒蕩憂顏永念平生意窮光不忍還淹流徒攀桂延佇空結蘭雙劍將離別先在匣中鳴煙雨交將夕從此忽分形雌沉吳江裏雄飛入楚城吳江深無底楚闕有崇扃一為天地別豈直限幽明神物終不隔千祀儻還并採菱歌七首驚舲馳桂浦息棹偃椒潭簫弄澄湘北菱歌清漢南弭榜搴蕙荑停唱紉薰若含傷拾泉花縈念採雲萼睽闊逢暄新悽怨值妍華秋心不可蕩春思亂如麻要豔雙嶼裏望美兩洲間裊裊風出浦容容日向山煙曀越障深箭迅楚江急空抱琴中悲徒望近關泣緘歎凌珠淵收慨上金堤春芳行歇落是人方未齊思今懷近憶望古懷遠識懷古復懷今長懷終無極山行見孤桐桐生叢石裏根孤地寒陰上倚崩岸勢下帶洞阿深奔泉冬激射霧雨夏霖淫未霜葉已肅不風條自吟昏明積苦思晝夜叫哀禽棄妾望掩淚逐臣對撫心雖以慰單危悲涼不可任幸願見雕斫為君堂上琴
