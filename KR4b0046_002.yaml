body:
  text: 卷二尺蠖賦智哉尺蠖觀機而作申非向厚屈非向薄當靜泉渟遇躁風驚起軒軀以曠跨伏纍氣而併形冰炭弗觸鋒刃靡忤逢嶮蹙蹐值夷舒步忌好退之見猜哀必進而為蠹每驤首以瞰途常佇景而翻路故身不豫託地無前期動靜必觀於物消息各隨乎時從方而應何慮何思是以軍算慕其權國容擬其變高賢圖之以隱淪智士以之而藏見笑靈蛇之久蟄羞龍德之方戰理害道而為尤事傷生而感賤苟見義而守勇豈專取於弦箭觀漏賦并序觀漏賦并序客有觀於漏者退而歎曰夫及遠者箭也而定遠非箭之功為生者我也而制生非我之情故自箭而為心不可憑者絃因生以觀我不可恃者年憑其不可恃故以悲哉況乎沉華密遠輕波潛耗而感神嬰慮者又自外而傷壽以是思生生亦勤矣乃為賦云佩流歎於馳年纓華思於奔月結蘭苕以望楚弄參差以歌越撫凝肌於遷滯鑑雕容於髣佛景有墜而易昏憂無方而難歇歷玫階而升隩訪金壺之盈闕觀騰波之吞寫視驚箭之登沒箭既沒而復登波長瀉而弗歸注沉穴而海漏射懸塗而電飛墐戶牖而知天掩雲霧而測暉創百齡於纖隱積千里於空微彼崢崢而行溢此冉冉而逾衰撫寸心而未改指分光而永違昔傷矢之奔禽聞虛弦之顛仆徒嬰刃而知懼豈潛機之能覺惟生經之靃靡亦悲長而歡促橫證古而秉心抱空意其如玉波沉沉而東注日滔滔而西屬落繁馨於纖草殞豐華於喬木對昃離而後歌據窮蹊而方哭雖接薪之更傳寧絶明之還續貫古今而并念信寡易而多難時不留乎激矢生乃急於走丸既河源之莫壅又吹波而助瀾神怵迥而多慮心𨍜𨎹而鮮歡望天涯而佇念擢雄劍而長歎嗟生民之永迷躬與後而皆恤死零落而無二生差池之非一理幽分於化前算冥定於天秩與艾骨而招病猶刳腸而興疾情殊用而俱盡事離方而同失聊弭志以高歌順煙雨而沉逸於是隨秋鴻而泛渚逐春燕而登梁進賦詩而展念退陳酒以排傷物不可以兩大時無得而雙昌薰晚華而後落槿早秀而前亡姑屏憂以愈思樂茲情於寸光從江河之紆直委天地之圓方漏盈兮漏虛長無絶兮芬芳野鵝賦并序有獻野鵝於臨川王世子愍其樊縶命為之賦其辭曰集陳之隼以自遠而稱神栖漢之雀乃出幽而見珍此璅禽其何取亦廁景而承仁捨水澤之歡逸對鍾鼓之悲辛豈徇利而輕命將感愛而投身入長羅之逼脅恨高繳之樊縈邈辭朋而別偶超煙鶩而風行跨日月而遙逝忽瞻國而望城踐菲迹於瑤塗升弱羽於丹庭瞰東西之繡戶眺左右之金扃貌纖殺而含悴心翻越而慚驚若墜淵而墮谷恍不知其所寧惟君囿之珍麗實妙物之所殷翔海澤之輕鷗巢天宿之鳴鶉鶡程材於梟猛翬薦體之雕文既敷容以照景亦選翮以排雲雖居物以成偶終在我以非群望征雲而延悼顧委翼而自傷無青雀之銜命乏赤鴈之嘉祥空穢君之園池徒慚君之稻粱願引身而剪迹抱末志而幽藏於是流歲遂遠慘節方崇雲纏海岱風拂崤潼飛雲馳霰飄沙舞蓬視清池之初涸望緑林之始空立菰蒲之寒渚託隻影而為雙宛拔啄而掩眥悲結悵而滿胸處朝晝而雖念假外見而遷排涉修夜之長寂信專思而知哀風梢梢而過樹月蒼蒼而照臺冰依岸而早結霜託草而先摧斂雙翮於水裔翹孤趾於林隈情無方而雨集事有限而星乖在俄頃而猶悼矧窮生之所懷聞宿世之高賢澤無微而不均育草木而明義愛禽鳥而昭仁全殞卵而來鳳放乳麑而感麟雖陋生於萬物若沙漠之一塵苟全軀而畢命庶魂報以自申傷逝賦晨登南山望美中阿露團秋槿風卷寒蘿悽愴傷心悲如之何盡若窮煙離若剪絃如影滅地猶星殞天棄華宇於明世閉金扃於下泉永山河以自畢眇千齡而弗旋思一言於向時邈衆代於古年逝稍遠而變體浸幽明而改時覽篇迹之如旦婉遺意而在茲忽若謂其不然自惆悵而驚疑循堂廡而下降歷幃戶而升基服委襟而褫帶器蒙管而韜絲志存業而遺績身先物而長辭豈重歡而可覯追前感之無期寒往暑來而不窮哀極樂反而有終燧已遷而禮革月既逾而慶通心微微而就遠迹離離而絶容白日藹而回陰閨館寂而深重冀憑靈於前物佇美目乎房櫳徒望思以永久邈歸來其何從結單心於暮條掩行淚於晨風念沉悼而誰劇獨嬰哀於逝躬草忌霜而逼秋人惡老而逼衰誠衰耄之可忌或甘願而志違彼一息之短景乃纍恨之長暉尋平生之好醜成黃塵之是非將滅耶而尚在何有去而無歸惟桃李之零落生有促而非夭觀龜鵠之千祀年能富而情少反靈質於二塗亂感悅於雙抱日月飄而不留命倏忽而誰保譬明隙之在梁如風露之停草髮迎憂而送華貌先悴而收藻共甘苦其幾人曾無得而偕老拂埃琴而抽思啓陳書而遐討自古來而有之夫何怨乎天道園葵賦風暖凌開土冒泉動遊塵曝日鳴雉依隴主人拂黃冠拭藜杖布蔬種平圻壤通畔修直膏畝夷敞白莖紫蒂豚耳鴨掌溝東陌西行三畦兩既區既鉏乃露乃映句萌欲伸叢芽將散爾乃晨露夕陰霏雲四委沉雷遠震飛雨輕灑徐未及晞疾而不靡柔莩爰秀剛甲以解稚葉萍布弱陰競抽萋萋翼翼沃沃油油下葳蕤而被徑上參差而覆疇承朝陽之麗景得傾柯之所投仕非魯相有不拔之利賓惟二仲無逸馬之憂顧堇荼而莫偶豈蘋藻之薦羞若乃鄰老談稼女嫗歸桑拂此葦席炊彼穄粱甃壺援醢曲瓢卷漿乃羹乃瀹堆鼎盈筐甘旨蒨脆柔滑芬芳消淋逐水潤胃調腸於是既飫徹盤投筯回小人之腹為君子之慮近觀物運遠訪師聖聲數後彰律理前定烏非黔黑鶴豈浴淨彼圓行而方止固得之於天性伊冬箑而夏裘無雙功而並盛蕩然任心樂道安命春風夕來秋日晨映獨酌南軒擁琴孤聽篇章間作以歌以詠魚深沉而鳥高飛孰知美色之為正
